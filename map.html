<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Map & Evacuation | RESCUE-IOT</title>

  <link
    rel="icon"
    href="assets/May%207,%202026,%2007_38_44%20PM%20(1).png"
    type="image/png"
  >

  <!-- Main application styles -->
  <link
    rel="stylesheet"
    href="css/global.css"
  >

  <link
    rel="stylesheet"
    href="css/components.css"
  >

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Map styles -->
  <link
    rel="stylesheet"
    href="css/map.css"
  >

  <link
    rel="stylesheet"
    href="css/palette.css"
  >

  <style>
    #map-root {
      min-height: 0;
    }

    #rescue-map {
      width: 100%;
      min-height: 420px;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #eaf3f8;
      border-radius: 14px;
    }

    .map-layout {
      width: 100%;
      min-height: 420px;
    }

    .map-main-panel {
      min-height: 420px;
    }

    .resident-map-panel,
    .responder-map-panel {
      width: 100%;
      min-height: 360px;
    }

    .resident-map-panel #rescue-map,
    .responder-map-panel #rescue-map {
      min-height: 360px;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      min-height: inherit;
      font-family: inherit;
      background: #eaf3f8;
    }

    .map-tile-error {
      position: absolute;
      z-index: 1000;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      max-width: calc(100% - 40px);
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15);
      color: #475569;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .map-loading {
      position: absolute;
      inset: 0;
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #edf5f9;
    }

    .map-loading-card {
      width: min(90%, 560px);
      padding: 28px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .map-loading-card strong {
      display: block;
      font-size: 20px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .map-loading-card span {
      color: #64748b;
      font-size: 15px;
    }

    .rescue-person-marker {
      background: transparent;
      border: 0;
    }

    .rescue-person-marker svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    @media (max-width: 900px) {
      #rescue-map,
      .map-layout,
      .map-main-panel {
        min-height: 520px;
      }
    }

    @media (max-width: 600px) {
      #rescue-map,
      .map-layout,
      .map-main-panel {
        min-height: 430px;
      }

      .resident-map-panel,
      .responder-map-panel,
      .resident-map-panel #rescue-map,
      .responder-map-panel #rescue-map {
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <aside
    class="sidebar"
    id="sidebar">
  </aside>

  <header
    class="top-header"
    id="top-header">
  </header>

  <main class="main-content">
    <div
      class="content-area"
      id="map-root">
    </div>
  </main>

  <!-- Load Leaflet FIRST -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- RESCUE-IOT application -->
  <script type="module">

    import "./js/firebase.js";

    import "./js/data.js";

    await import("./js/app.js");

    await import("./js/map.js");

    console.log("RESCUE-IOT: Map application started.");

  </script>

</body>

</html>
